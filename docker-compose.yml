# SB1 Web App — สำหรับรันบน NAS (UGREEN DXP4800 Plus / UGOS Pro)
#
# โครงสร้างโฟลเดอร์บน NAS (โค้ด / ข้อมูล / ความลับ แยกกันชัดเจน):
#   /volume1/docker/sb1/
#   ├── app/       ← โค้ด (โฟลเดอร์นี้ = git clone; ลบหรือโคลนใหม่ได้ ข้อมูลไม่กระทบ)
#   ├── data/      ← ข้อมูลจริง + ไฟล์สำรอง (ห้ามลบ)
#   └── secrets/   ← .env (รหัส admin ตอนตั้งค่าครั้งแรก)
#
# รันคำสั่งทั้งหมดจากในโฟลเดอร์ app/
#   docker compose up -d --build      เริ่มใช้งาน (สร้าง image + รันเบื้องหลัง)
#   docker compose logs -f            ดู log สด
#   docker compose restart            รีสตาร์ท
#   docker compose down               หยุด (ข้อมูลใน ../data ไม่ถูกลบ)
#   git pull && docker compose up -d --build    อัปเดตเวอร์ชันใหม่

services:
  sb1:
    build: .
    image: sb1-webapp:latest
    container_name: sb1
    restart: unless-stopped

    ports:
      # ซ้าย = พอร์ตบน NAS · ขวา = พอร์ตในคอนเทนเนอร์ (อย่าแก้ตัวขวา)
      # ถ้าพอร์ต 8081 ชนกับแอพอื่นบน NAS ให้แก้เฉพาะเลขตัวซ้าย เช่น "8091:8081"
      # ผูกกับทุก interface เพื่อให้เข้าผ่าน Tailscale ได้ — ห้าม port forward ที่เราเตอร์
      - "8081:8081"

    volumes:
      # ข้อมูลจริงอยู่นอกโฟลเดอร์โค้ด — ลบ/โคลน app/ ใหม่ได้โดยข้อมูลไม่หาย
      # สำรองข้อมูล = สำรองโฟลเดอร์ ../data โฟลเดอร์เดียวจบ
      - ../data:/data

    # ค่าลับและค่าตั้งเพิ่มเติมอ่านจาก secrets/.env (ไม่มีไฟล์ก็รันได้ตามปกติ)
    # ใส่ได้: ADMIN_USER, ADMIN_PASS (เฉพาะตอนสร้าง/รีเซ็ต admin), SESSION_HOURS
    #         NEWS_API_KEY (รหัสเดียวกับ REPORT_CENTER_API_KEY ของเว็บรายงานข่าว — ใส่แล้วจะดึงข่าวอัตโนมัติ)
    env_file:
      - path: ../secrets/.env
        required: false

    environment:
      # ค่าคงที่ของคอนเทนเนอร์ — ห้ามย้ายไป secrets/.env เพราะค่าตรงนี้จะทับเสมอ
      - PORT=8081
      - DATA_DIR=/data
      - TZ=Asia/Bangkok
      # ที่อยู่เว็บรายงานข่าวสำหรับลิงก์ "เปิดรายงานต้นฉบับ" (เปิดจากเบราว์เซอร์ผ่าน Tailscale)
      - NEWS_LINK_URL=http://100.86.87.94:5001

    # ให้คอนเทนเนอร์นี้เรียกเว็บรายงานข่าว (พอร์ต 5001 บน NAS เครื่องเดียวกัน) ผ่านชื่อ host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: sb1_net
